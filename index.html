<!doctype html>
<html lang="rw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166534"><title>Jules Shop Ltd — Ibaruramari</title>
<style>
:root{--g:#166534;--g2:#15803d;--light:#f0fdf4;--ink:#111827;--muted:#647067;--line:#dfe7e1;--white:#fff;--red:#b91c1c;--amber:#a16207;--shadow:0 8px 30px #052e1610}*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:linear-gradient(120deg,#14532d,#15803d);color:white;padding:16px max(16px,calc((100vw - 1250px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:13px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:19px;line-height:1.15;margin:0}.brand p{margin:4px 0 0;font-size:12px;color:#dcfce7}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:650}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.green{background:#dcfce7;color:#14532d;border-color:#bbf7d0}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.layout{max-width:1250px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.side{align-self:start;background:white;border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:88px}.navbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#374151;margin:2px 0;font-weight:600}.navbtn.active,.navbtn:hover{background:#dcfce7;color:#14532d}.navbtn .ico{width:23px;text-align:center;font-size:18px}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 15px}.pagehead h2{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:650}.stat .value{font-size:23px;font-weight:800;margin:8px 0 4px;letter-spacing:-.5px;overflow-wrap:anywhere}.stat .hint{font-size:12px;color:var(--muted)}.stat .emoji{float:right;font-size:22px}.panel{margin-top:14px}.panel h3{margin:0 0 13px;font-size:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;font-weight:700;color:#4b5563}.field input,.field select,.field textarea,.search{border:1px solid #d1d9d3;border-radius:9px;padding:10px 11px;background:white;min-width:0;width:100%;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.formgrid .wide{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;background:white;white-space:nowrap}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1ee;font-size:13px}th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#647067;background:#f8fbf8}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;background:#dcfce7;color:#166534;padding:4px 8px;font-size:11px;font-weight:750}.pill.warn{background:#fef3c7;color:#92400e}.pill.red{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:var(--muted);padding:26px}.actions{display:flex;gap:6px}.notice{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:11px;padding:12px 14px;color:#14532d;font-size:13px;margin:12px 0}.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;border-radius:11px;padding:12px 14px;font-size:13px;margin:12px 0}.hidden{display:none!important}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.quick button{border:1px solid var(--line);background:white;border-radius:12px;padding:15px;text-align:left;font-weight:700}.quick button span{display:block;font-size:22px;margin-bottom:7px}.quick button small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.footer{max-width:1250px;padding:0 16px 24px;margin:auto;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:#071b10a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.overlay.show{display:flex}.modal{background:white;border-radius:16px;padding:20px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.modalhead h3{margin:0}.close{border:0;background:#f3f4f6;border-radius:9px;padding:8px 11px}.cartline{display:grid;grid-template-columns:1fr 85px 95px 34px;gap:7px;align-items:center;margin:8px 0}.cartline input,.cartline select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.totalbar{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f0fdf4;border-radius:10px;padding:12px;margin-top:12px;font-weight:800}.flag{font-size:18px}.badgebrand{background:#111827;color:white;padding:4px 8px;border-radius:6px;font-size:11px}.camera{width:100%;max-height:240px;background:#111;border-radius:12px;margin-top:8px}.smallnote{font-size:12px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:3px;padding:7px}.navbtn{width:auto;white-space:nowrap;padding:9px 11px}.navbtn .ico{width:auto}.navbtn span:last-child{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:12px 14px}.brand h1{font-size:17px}.top-actions .btn{font-size:12px;padding:8px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.grid{gap:8px}.stat,.panel{padding:12px}.stat .value{font-size:19px}.pagehead h2{font-size:21px}.formgrid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.brand p{font-size:10px}.top-actions{gap:4px}.cartline{grid-template-columns:1fr 62px 78px 30px}.cartline input,.cartline select{padding:8px 5px;font-size:12px}}
@media print{.top,.side,.no-print,.footer{display:none!important}.layout{display:block;margin:0;padding:0}.panel,.stat{box-shadow:none;border:0}.content{width:100%}body{background:white}.print-area{display:block!important}}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">JS</div><div><h1>Jules Shop Ltd <span class="flag">🇷🇼</span></h1><p>Ibaruramari • Stock • Gucuruza neza</p></div></div><div class="top-actions"><button class="btn green" onclick="openSale()">＋ Igurisha</button><button class="btn" onclick="document.getElementById('backupFile').click()">⬆ Backup</button></div></header>
<div class="layout"><aside class="side" id="nav">
<button class="navbtn active" data-page="dashboard"><span class="ico">🏠</span><span>Ahabanza</span></button><button class="navbtn" data-page="products"><span class="ico">📦</span><span>Ibicuruzwa / Stock</span></button><button class="navbtn" data-page="sales"><span class="ico">🧾</span><span>Amaduka / Igurisha</span></button><button class="navbtn" data-page="customers"><span class="ico">👥</span><span>Abakiriya & amadeni</span></button><button class="navbtn" data-page="suppliers"><span class="ico">🚚</span><span>Abaranguraho</span></button><button class="navbtn" data-page="purchases"><span class="ico">🛒</span><span>Komanda / Kugura</span></button><button class="navbtn" data-page="expenses"><span class="ico">💸</span><span>Ayasohoka</span></button><button class="navbtn" data-page="reports"><span class="ico">📊</span><span>Raporo</span></button><button class="navbtn" data-page="staff"><span class="ico">🔐</span><span>Abakozi & uruhushya</span></button><button class="navbtn" data-page="settings"><span class="ico">⚙️</span><span>Backup & igenamiterere</span></button>
</aside><main class="content" id="app"></main></div><div class="footer">Jules Shop Ltd • 🇷🇼 Amafaranga: RWF • Amakuru abikwa muri browser y'iyi telefoni. Kora backup buri gihe.</div>
<div class="overlay" id="modal"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Ongeramo</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><input id="backupFile" type="file" accept="application/json,.json" hidden onchange="importBackup(event)">
<script>
const KEY='julesShopLtdV2';const money=n=>'RWF '+Math.round(Number(n)||0).toLocaleString('en-US');const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=load();function blank(){return {products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],staff:[{id:'owner',name:'Umuyobozi',username:'owner',role:'admin',pin:'1234'}],settings:{shop:'Jules Shop Ltd',phone:'',address:'Rwanda',currency:'RWF'}}}function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render(current)}let current='dashboard';let roleNow='admin';function fmtDate(d){return d||today()}function sum(a,fn){return a.reduce((t,x)=>t+(fn?Number(fn(x)||0):Number(x)||0),0)}function paidSale(s){return Number(s.paid)||0}function saleTotal(s){return Number(s.total)||0}function debtCust(id){return sum(db.sales.filter(s=>s.customerId===id),s=>Math.max(0,s.total-s.paid))-sum(db.customers.filter(c=>c.id===id),c=>0)}function supplierDebt(id){return sum(db.purchases.filter(p=>p.supplierId===id),p=>Math.max(0,p.total-p.paid))}function allSales(){return sum(db.sales,s=>s.total)}function allPaid(){return sum(db.sales,s=>s.paid)}function totalExpenses(){return sum(db.expenses,e=>e.amount)}function purchaseCost(){return sum(db.purchases,p=>p.total)}function costOfSold(){return sum(db.sales,s=>s.items.reduce((a,i)=>a+(Number(i.cost)||0)*Number(i.qty||0),0))}function profit(){return allSales()-costOfSold()-totalExpenses()}
function pageTitle(p){return ({dashboard:'Incamake y’iduka',products:'Ibicuruzwa na Stock',sales:'Amaduka / Amateka y’igurisha',customers:'Abakiriya n’amadeni',suppliers:'Abaranguraho n’amafaranga mbagomba',purchases:'Komanda no kugura ibicuruzwa',expenses:'Amafaranga asohoka',reports:'Raporo z’ibaruramari',staff:'Konti z’abakozi n’uburenganzira',settings:'Backup n’igenamiterere'})[p]||'Jules Shop Ltd'}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;current=b.dataset.page;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));render(current)});
function render(p='dashboard'){current=p;const app=document.getElementById('app');let body='';if(p==='dashboard')body=dashboard();if(p==='products')body=productsPage();if(p==='sales')body=salesPage();if(p==='customers')body=customersPage();if(p==='suppliers')body=suppliersPage();if(p==='purchases')body=purchasesPage();if(p==='expenses')body=expensesPage();if(p==='reports')body=reportsPage();if(p==='staff')body=staffPage();if(p==='settings')body=settingsPage();app.innerHTML=`<div class="pagehead"><div><h2>${pageTitle(p)}</h2><div class="sub">${new Date().toLocaleDateString('rw-RW',{weekday:'long',year:'numeric',month:'long',day:'numeric'})} • <span class="flag">🇷🇼</span> Rwanda</div></div><div class="no-print"><span class="badgebrand">${esc(db.settings.shop||'Jules Shop Ltd')}</span></div></div>${body}`;}
function stat(label,val,emoji,hint=''){return `<div class="stat"><span class="emoji">${emoji}</span><div class="label">${label}</div><div class="value">${val}</div><div class="hint">${hint}</div></div>`}function dashboard(){let stockVal=sum(db.products,p=>p.stock*p.cost),low=db.products.filter(p=>p.stock<=Number(p.min||5));return `<div class="grid">${stat('Igurisha ryose',money(allSales()),'💵',db.sales.length+' inyemezabuguzi')}${stat('Amafaranga yakiriwe',money(allPaid()),'✅','Avuye mu bakiriya')}${stat('Inyungu igereranyije',money(profit()),'📈','Igurisha − ikiguzi cy’ibicuruzwa byagurishijwe − ayasohotse')}${stat('Agaciro ka stock',money(stockVal),'📦',db.products.length+' bwoko bw’ibicuruzwa')}</div><div class="grid" style="margin-top:12px">${stat('Amadeni y’abakiriya',money(sum(db.sales,s=>Math.max(0,s.total-s.paid))),'👥','Amafaranga atarishyurwa')}${stat('Ayo mbagomba',money(sum(db.purchases,p=>Math.max(0,p.total-p.paid))),'🚚','Abacuruzi/abaranguraho')}${stat('Amafaranga asohotse',money(totalExpenses()),'💸',db.expenses.length+' byishyuwe')}${stat('Ibicuruzwa bishira',low.length,'⚠️','Bikwiye kongerwa muri stock')}</div><div class="quick" style="margin-top:15px"><button onclick="openSale()"><span>🧾</span>Gukora igurisha<small>Inyemezabuguzi nshya</small></button><button onclick="openProduct()"><span>📦</span>Kongeramo stock<small>Igicuruzwa gishya</small></button><button onclick="openPurchase()"><span>🛒</span>Gutanga komanda<small>Kugura ibicuruzwa</small></button><button onclick="openExpense()"><span>💸</span>Kwandika ayasohotse<small>Transport, ubukode, n’ibindi</small></button><button onclick="current='reports';render(current)"><span>📊</span>Reba raporo<small>Inyungu n’igihombo</small></button><button onclick="exportBackup()"><span>💾</span>Kora backup<small>Bika amakuru yawe</small></button></div><div class="panel"><div class="panel-head"><h3>⚠️ Ibicuruzwa biri gushira</h3><button class="btn small" onclick="current='products';render(current)">Reba byose →</button></div>${low.length?table(['Igicuruzwa','Barcode','Stock isigaye','Urugero ntarengwa'],low.map(p=>[`${p.emoji||'📦'} ${esc(p.name)}`,esc(p.barcode||'—'),`<span class="pill ${p.stock<=0?'red':'warn'}">${p.stock}</span>`,p.min||5])):'<div class="empty">Nta bicuruzwa biri munsi y’urugero rwagenwe.</div>'}</div>`}
function table(head,rows){if(!rows.length)return '<div class="empty">Nta makuru arimo. Kanda kuri “Ongeramo” kugira ngo utangire.</div>';return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function productsPage(){return `<div class="toolbar"><input class="search" style="max-width:320px" placeholder="Shakisha izina cyangwa barcode…" oninput="filterRows(this.value,'prodtable')"><button class="btn primary" onclick="openProduct()">＋ Ongeramo igicuruzwa</button><button class="btn" onclick="scanBarcode()">📷 Soma barcode</button><button class="btn" onclick="downloadCSV('products')">⬇ CSV</button></div><div id="prodtable">${productsTable()}</div><div class="notice">📷 Barcode: scanner yo muri camera ikora kuri Chrome zimwe zishyigikira BarcodeDetector. Ushobora no gukoresha scanner ya USB/Bluetooth cyangwa kwandika kode mu mwanya wa barcode.</div>`}function productsTable(){return table(['Igicuruzwa','Barcode','Igiciro cyo kugura','Igiciro cyo kugurisha','Stock','Agaciro ka stock','Ibikorwa'],db.products.map(p=>[`${p.emoji||'📦'} ${esc(p.name)}`,esc(p.barcode||'—'),money(p.cost),money(p.price),`<span class="pill ${p.stock<=Number(p.min||5)?'warn':''}">${p.stock}</span>`,money(p.stock*p.cost),`<div class="actions"><button class="btn small" onclick="editProduct('${p.id}')">Hindura</button><button class="btn small danger" onclick="delItem('products','${p.id}')">Siba</button></div>`]))}
function customersPage(){return `<div class="toolbar"><input class="search" placeholder="Shakisha umukiriya…" oninput="filterRows(this.value,'custtable')"><button class="btn primary" onclick="openCustomer()">＋ Umukiriya mushya</button><button class="btn" onclick="downloadCSV('customers')">⬇ CSV</button></div><div id="custtable">${customersTable()}</div>`}function customersTable(){return table(['Umukiriya','Telefone','Amadeni','Ibikorwa'],db.customers.map(c=>{let debt=sum(db.sales.filter(s=>s.customerId===c.id),s=>Math.max(0,s.total-s.paid));return [esc(c.name),esc(c.phone||'—'),`<span class="pill ${debt?'warn':''}">${money(debt)}</span>`,`<div class="actions"><button class="btn small" onclick="payCustomer('${c.id}')">Yishyuye</button><button class="btn small" onclick="editCustomer('${c.id}')">Hindura</button><button class="btn small danger" onclick="delItem('customers','${c.id}')">Siba</button></div>`]}))}
function suppliersPage(){return `<div class="toolbar"><input class="search" placeholder="Shakisha umuranguzi…" oninput="filterRows(this.value,'suptable')"><button class="btn primary" onclick="openSupplier()">＋ Umuranguzi mushya</button><button class="btn" onclick="downloadCSV('suppliers')">⬇ CSV</button></div><div id="suptable">${suppliersTable()}</div>`}function suppliersTable(){return table(['Umuranguzi','Telefone','Ayo mbagomba','Ibikorwa'],db.suppliers.map(s=>[esc(s.name),esc(s.phone||'—'),`<span class="pill ${supplierDebt(s.id)?'warn':''}">${money(supplierDebt(s.id))}</span>`,`<div class="actions"><button class="btn small" onclick="paySupplier('${s.id}')">Nishyuye</button><button class="btn small" onclick="editSupplier('${s.id}')">Hindura</button><button class="btn small danger" onclick="delItem('suppliers','${s.id}')">Siba</button></div>`]))}
function salesPage(){return `<div class="toolbar"><input class="search" placeholder="Shakisha nomero y’inyemezabuguzi…" oninput="filterRows(this.value,'saletable')"><button class="btn primary" onclick="openSale()">＋ Igurisha rishya</button><button class="btn" onclick="downloadCSV('sales')">⬇ CSV</button></div><div id="saletable">${salesTable()}</div>`}function salesTable(){return table(['Inyemezabuguzi','Itariki','Umukiriya','Igiteranyo','Yishyuye','Umwenda','Ibikorwa'],[...db.sales].reverse().map(s=>[esc(s.invoice),s.date,esc(db.customers.find(c=>c.id===s.customerId)?.name||'Umukiriya utanditse'),money(s.total),money(s.paid),`<span class="pill ${s.total>s.paid?'warn':''}">${money(s.total-s.paid)}</span>`,`<div class="actions"><button class="btn small" onclick="printInvoice('${s.id}')">🖨 Capa</button><button class="btn small danger" onclick="delSale('${s.id}')">Siba</button></div>`]))}
function purchasesPage(){return `<div class="toolbar"><button class="btn primary" onclick="openPurchase()">＋ Komanda / kugura</button><button class="btn" onclick="downloadCSV('purchases')">⬇ CSV</button></div><div class="notice">🛒 Koresha iyi page wandike ibyo waguze cyangwa komanda wohereje ku muranguzi. Ibyo wemeje ko byageze byongerwa muri stock.</div>${table(['Komanda','Itariki','Umuranguzi','Ibicuruzwa','Igiteranyo','Yishyuye','Ayo mbagomba','Ibikorwa'],[...db.purchases].reverse().map(p=>[esc(p.orderNo),p.date,esc(db.suppliers.find(s=>s.id===p.supplierId)?.name||'Nta muranguzi'),p.items.map(i=>esc(i.name)+' × '+i.qty).join(', '),money(p.total),money(p.paid),money(p.total-p.paid),`<div class="actions"><span class="pill">${p.received?'Byageze':'Komanda'}</span><button class="btn small" onclick="receivePurchase('${p.id}')">${p.received?'Stock yageze':'Byageze'}</button><button class="btn small danger" onclick="delPurchase('${p.id}')">Siba</button></div>`]))}`}
function expensesPage(){return `<div class="toolbar"><button class="btn primary" onclick="openExpense()">＋ Andika amafaranga asohotse</button><button class="btn" onclick="downloadCSV('expenses')">⬇ CSV</button></div>${table(['Itariki','Icyo yakoreshejwe','Icyiciro','Amafaranga','Uwayakiriye','Ibikorwa'],[...db.expenses].reverse().map(e=>[e.date,esc(e.title),esc(e.category),money(e.amount),esc(e.payee||'—'),`<button class="btn small danger" onclick="delItem('expenses','${e.id}')">Siba</button>`]))}`}
function reportsPage(){let byMonth={};db.sales.forEach(s=>{let m=(s.date||today()).slice(0,7);byMonth[m]??={sales:0,paid:0};byMonth[m].sales+=s.total;byMonth[m].paid+=s.paid});return `<div class="grid">${stat('Igurisha ryose',money(allSales()),'💵')}${stat('Ikiguzi cy’ibyagurishijwe',money(costOfSold()),'📦')}${stat('Amafaranga asohotse',money(totalExpenses()),'💸')}${stat('Inyungu / igihombo',money(profit()),profit()>=0?'📈':'📉',profit()<0?'Igihombo':'Inyungu igereranyije')}</div><div class="panel"><div class="panel-head"><h3>Raporo y’igurisha ku kwezi</h3><button class="btn" onclick="downloadCSV('reports')">⬇ Kuramo CSV</button></div>${table(['Ukwezi','Igurisha','Yishyuye','Umwenda'],Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,v])=>[m,money(v.sales),money(v.paid),money(v.sales-v.paid)]))}</div><div class="panel"><h3>Incamake y’ibaruramari</h3>${table(['Ikintu','Amafaranga'],[['Igurisha ryose',money(allSales())],['Ikiguzi cy’ibicuruzwa byagurishijwe',money(costOfSold())],['Amafaranga asohotse',money(totalExpenses())],['Inyungu / igihombo igereranyije',money(profit())],['Amadeni y’abakiriya',money(sum(db.sales,s=>s.total-s.paid))],['Ayo ubereyemo abaranguraho',money(sum(db.purchases,p=>p.total-p.paid))],['Agaciro ka stock kariho',money(sum(db.products,p=>p.stock*p.cost))]])}<div class="warnbox">Iyi ni raporo ifasha mu micungire y’iduka, si raporo yemejwe n’umucungamari. Inyungu ibarwa hakoreshejwe ikiguzi wanditse ku bicuruzwa; reba ko amakuru yawe yuzuye.</div></div>`}
function staffPage(){return `<div class="warnbox">🔐 Icyitonderwa cy'umutekano: konti zo muri iyi verisiyo ni iz'ibanze zibikwa muri browser imwe gusa. PIN ntirinda amakuru nka sisitemu ifite server; ntukoreshe iyi verisiyo mu guha abakozi batizewe uburenganzira bwo kureba amakuru y'ibanga. Konti y'igerageza: owner / PIN 1234 (hindura PIN cyangwa uyisibe).</div><div class="toolbar"><button class="btn primary" onclick="openStaff()">＋ Ongeramo umukozi</button></div>${table(['Izina','Username','Uruhare','PIN','Ibikorwa'],db.staff.map(s=>[esc(s.name),esc(s.username),esc(s.role==='admin'?'Umuyobozi':s.role==='sales'?'Ucuruza':'Stock'),s.pin? '••••':'—',`<button class="btn small" onclick="editStaff('${s.id}')">Hindura</button> <button class="btn small danger" onclick="delItem('staff','${s.id}')">Siba</button>`]))}<div class="panel"><h3>Uruhare rw’abakozi</h3><p class="smallnote">Umuyobozi: modules zose. Ucuruza: kugurisha no kureba abakiriya. Ushinzwe stock: ibicuruzwa no kugura. Muri iyi demo uruhushya rwandikwa gusa; ntirurinda tabs mu buryo bwizewe kugeza hiyongereye server authentication.</p></div>`}
function settingsPage(){return `<div class="panel"><h3>🏪 Amakuru y'iduka</h3><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>Izina ry'iduka</label><input name="shop" value="${esc(db.settings.shop)}" required></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(db.settings.phone||'')}" placeholder="078…"></div><div class="field"><label>Aho riherereye</label><input name="address" value="${esc(db.settings.address||'Rwanda')}"></div></div><p><button class="btn primary">Bika</button></p></form></div><div class="panel"><h3>💾 Backup & gusubizaho amakuru</h3><p>Backup ibika ibicuruzwa, abakiriya, amadeni, kugurisha, komanda, ayasohoka n'abakozi muri dosiye ya JSON.</p><div class="toolbar"><button class="btn primary" onclick="exportBackup()">⬇ Kuramo backup</button><button class="btn" onclick="document.getElementById('backupFile').click()">⬆ Subizaho backup</button><button class="btn" onclick="downloadCSV('products')">CSV y'ibicuruzwa</button></div><div class="warnbox">Bika backup kenshi kuri telefoni cyangwa ahandi hizewe. Gusubizaho backup bishobora gusimbura amakuru ari muri browser yawe. Amakuru abikwa kuri iyi browser gusa; ntiyihita ajya ku yindi telefoni.</div></div><div class="panel"><h3>🧾 Printer & barcode</h3><p>Inyemezabuguzi ifunguka muri print dialog ya Chrome. Hitamo printer ihujwe na telefoni yawe cyangwa “Save as PDF”. Scanner ya barcode ikora iyo browser n'igikoresho bibishyigikiye; ushobora no kwandika barcode mu ntoki.</p><div class="toolbar"><button class="btn" onclick="scanBarcode()">📷 Gerageza camera ya barcode</button><button class="btn" onclick="window.print()">🖨 Gerageza printer</button></div><p class="smallnote">Flag na emoji: 🇷🇼 Rwanda, 📦 stock, 🛒 kugura, 🧾 inyemezabuguzi, 💸 amafaranga. Emoji y'igicuruzwa ushobora kuyihitamo igihe wongeramo cyangwa uhindura igicuruzwa.</p></div><div class="panel"><h3>⚠️ Gusiba amakuru</h3><button class="btn danger" onclick="clearAll()">Siba amakuru yose yo muri iyi browser</button></div>`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function openProduct(id=''){let p=db.products.find(x=>x.id===id)||{};openModal(id?'Hindura igicuruzwa':'Ongeramo igicuruzwa',`<form onsubmit="saveProduct(event,'${id}')"><div class="formgrid">${field('Izina ry’igicuruzwa','name',p.name||'','text','required')}${field('Barcode / Kode','barcode',p.barcode||'')}${selectField('Emoji','emoji',['📦','🍚','🥤','🍞','🧼','🧴','🍬','🥫','🧃','👕','🔋','🛍️','🧹','🧻','🧃'].map(x=>[x,x]),p.emoji||'📦')}${field('Igiciro cyo kugura (RWF)','cost',p.cost||0,'number','min="0" required')}${field('Igiciro cyo kugurisha (RWF)','price',p.price||0,'number','min="0" required')}${field('Stock isigaye','stock',p.stock||0,'number','min="0" step="any" required')}${field('Stock ntarengwa yo kwibutsa','min',p.min??5,'number','min="0"')}${field('Icyiciro','category',p.category||'Rusange')}${field('Ahantu ibikwa','location',p.location||'')}${field('Ibisobanuro','notes',p.notes||'','text')}</div><p><button class="btn primary">Bika igicuruzwa</button></p></form>`)}function saveProduct(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let old=db.products.find(p=>p.id===id);let obj={...old,...f,id:id||uid(),cost:+f.cost,price:+f.price,stock:+f.stock,min:+f.min};if(old){let delta=obj.stock-old.stock;db.products=db.products.map(p=>p.id===id?obj:p)}else db.products.push(obj);save();closeModal()}function editProduct(id){openProduct(id)}function openCustomer(id=''){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Hindura umukiriya':'Umukiriya mushya',`<form onsubmit="savePerson(event,'customers','${id}')"><div class="formgrid">${field('Amazina','name',c.name||'','text','required')}${field('Telefone','phone',c.phone||'','tel')}${field('Aho atuye','address',c.address||'')}${field('Ibisobanuro','notes',c.notes||'')}</div><p><button class="btn primary">Bika umukiriya</button></p></form>`)}function editCustomer(id){openCustomer(id)}function openSupplier(id=''){let s=db.suppliers.find(x=>x.id===id)||{};openModal(id?'Hindura umuranguzi':'Umuranguzi mushya',`<form onsubmit="savePerson(event,'suppliers','${id}')"><div class="formgrid">${field('Izina ry’umuranguzi','name',s.name||'','text','required')}${field('Telefone','phone',s.phone||'','tel')}${field('Aho akorera','address',s.address||'')}${field('Ibisobanuro','notes',s.notes||'')}</div><p><button class="btn primary">Bika umuranguzi</button></p></form>`)}function editSupplier(id){openSupplier(id)}function savePerson(e,type,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let arr=db[type],old=arr.find(x=>x.id===id);let obj={...old,...f,id:id||uid()};db[type]=old?arr.map(x=>x.id===id?obj:x):[...arr,obj];save();closeModal()}
function openExpense(){openModal('Amafaranga asohotse',`<form onsubmit="saveExpense(event)"><div class="formgrid">${field('Itariki','date',today(),'date','required')}${field('Icyo yakoreshejwe','title','','text','required')}${selectField('Icyiciro','category',['Transport','Ubukode','Umushahara','Amazi n’amashanyarazi','Internet/telefone','Imisoro','Gusana','Ibindi'].map(x=>[x,x]))}${field('Amafaranga (RWF)','amount','','number','min="1" required')}${field('Uwayakiriye','payee')}${field('Inyandiko','notes')}</div><p><button class="btn primary">Bika amafaranga</button></p></form>`)}function saveExpense(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.expenses.push({...f,id:uid(),amount:+f.amount});save();closeModal()}
function openStaff(id=''){let s=db.staff.find(x=>x.id===id)||{};openModal(id?'Hindura konti y’umukozi':'Ongeramo umukozi',`<form onsubmit="saveStaff(event,'${id}')"><div class="formgrid">${field('Izina','name',s.name||'','text','required')}${field('Username','username',s.username||'','text','required')}${field('PIN (ibanga ry’igerageza)','pin',s.pin||'','password','required minlength="4"')}${selectField('Uruhare','role',[['admin','Umuyobozi'],['sales','Ucuruza'],['stock','Ushinzwe stock']],s.role||'sales')}</div><div class="warnbox">Izi konti ni demo yo kuri browser imwe, si uburyo bwizewe bwo kurinda amakuru kuri internet.</div><p><button class="btn primary">Bika konti</button></p></form>`)}function editStaff(id){openStaff(id)}function saveStaff(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let arr=db.staff,old=arr.find(x=>x.id===id);let obj={...old,...f,id:id||uid()};db.staff=old?arr.map(x=>x.id===id?obj:x):[...arr,obj];save();closeModal()}
function openPurchase(){if(!db.products.length){alert('Banza wongeremo igicuruzwa muri Stock.');return}let opts=db.products.map(p=>[p.id,`${p.emoji||'📦'} ${p.name} (stock ${p.stock})`]);openModal('Komanda / Kugura ibicuruzwa',`<form onsubmit="savePurchase(event)"><div class="formgrid">${field('Itariki','date',today(),'date','required')}${selectField('Umuranguzi','supplierId',[['','Hitamo umuranguzi'],...db.suppliers.map(s=>[s.id,s.name])])}${field('Nomero ya komanda','orderNo','PO-'+Date.now().toString().slice(-6))}${field('Amafaranga ya transport','transport','0','number','min="0"')}${field('Amafaranga wishyuye ubu','paid','0','number','min="0"')}${selectField('Stock yageze?','received',[['yes','Yego, ongera muri stock'],['no','Oya, ni komanda gusa']])}</div><h4>Ibicuruzwa byaguzwe</h4><div id="purchaseLines">${purchaseLine(opts)}</div><button type="button" class="btn" onclick="addPurchaseLine()">＋ Ongeraho igicuruzwa</button><div class="totalbar"><span>Igiteranyo (harimo transport)</span><strong id="purchaseTotal">RWF 0</strong></div><p><button class="btn primary">Bika komanda</button></p></form>`);window.purchaseOpts=opts;calcPurchase()}function purchaseLine(opts){return `<div class="cartline"><select name="prod">${opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select><input name="qty" type="number" min="1" step="any" value="1" aria-label="Umubare"><input name="cost" type="number" min="0" step="any" value="0" aria-label="Igiciro"><button type="button" class="btn small danger" onclick="this.parentElement.remove();calcPurchase()">×</button></div>`}function addPurchaseLine(){document.getElementById('purchaseLines').insertAdjacentHTML('beforeend',purchaseLine(window.purchaseOpts));calcPurchase()}function calcPurchase(){let el=document.getElementById('purchaseLines');if(!el)return;let total=0;el.querySelectorAll('.cartline').forEach(line=>{let p=db.products.find(x=>x.id===line.querySelector('[name=prod]').value);let c=line.querySelector('[name=cost]');if(+c.value===0&&p)c.value=p.cost;total+=(+line.querySelector('[name=qty]').value||0)*(+c.value||0)});total+=+(document.querySelector('#modal [name=transport]')?.value||0);document.getElementById('purchaseTotal').textContent=money(total);el.querySelectorAll('input,select').forEach(x=>x.oninput=calcPurchase);document.querySelector('#modal [name=transport]').oninput=calcPurchase}function savePurchase(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let items=[...document.querySelectorAll('#purchaseLines .cartline')].map(l=>{let p=db.products.find(x=>x.id===l.querySelector('[name=prod]').value);return {productId:p.id,name:p.name,qty:+l.querySelector('[name=qty]').value,cost:+l.querySelector('[name=cost]').value}});let total=sum(items,i=>i.qty*i.cost)+(+f.transport||0);let obj={...f,id:uid(),items,total,paid:+f.paid||0,received:f.received==='yes',transport:+f.transport||0};db.purchases.push(obj);if(obj.received)items.forEach(i=>{let p=db.products.find(p=>p.id===i.productId);if(p){p.stock+=i.qty;p.cost=i.cost}});save();closeModal()}
function openSale(){if(!db.products.length){alert('Banza wongeremo ibicuruzwa muri Stock.');return}let opts=db.products.map(p=>[p.id,`${p.emoji||'📦'} ${p.name} — ${money(p.price)} (stock ${p.stock})`]);openModal('Igurisha rishya / Inyemezabuguzi',`<form onsubmit="saveSale(event)"><div class="formgrid">${field('Itariki','date',today(),'date','required')}${selectField('Umukiriya','customerId',[['','Umukiriya utanditse'],...db.customers.map(c=>[c.id,c.name])])}${field('Amafaranga yakiriwe','paid','0','number','min="0"')}${field('Discount (RWF)','discount','0','number','min="0"')}${field('Inyandiko','notes')}</div><h4>Ibicuruzwa bigurishwa</h4><div id="saleLines">${saleLine(opts)}</div><button type="button" class="btn" onclick="addSaleLine()">＋ Ongeraho igicuruzwa</button><div class="totalbar"><span>Igiteranyo</span><strong id="saleTotal">RWF 0</strong></div><div class="smallnote">Igiciro cy'igicuruzwa ni igiciro cyo kugurisha. Stock iragabanuka iyo ubitse igurisha.</div><p><button class="btn primary">Bika & ukore inyemezabuguzi</button></p></form>`);window.saleOpts=opts;calcSale()}function saleLine(opts){return `<div class="cartline"><select name="prod">${opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select><input name="qty" type="number" min="1" step="any" value="1" aria-label="Umubare"><input name="price" type="number" min="0" step="any" value="0" aria-label="Igiciro"><button type="button" class="btn small danger" onclick="this.parentElement.remove();calcSale()">×</button></div>`}function addSaleLine(){document.getElementById('saleLines').insertAdjacentHTML('beforeend',saleLine(window.saleOpts));calcSale()}function calcSale(){let el=document.getElementById('saleLines');if(!el)return;let total=0;el.querySelectorAll('.cartline').forEach(line=>{let p=db.products.find(x=>x.id===line.querySelector('[name=prod]').value),price=line.querySelector('[name=price]');if(+price.value===0&&p)price.value=p.price;total+=(+line.querySelector('[name=qty]').value||0)*(+price.value||0)});total=Math.max(0,total-(+document.querySelector('#modal [name=discount]')?.value||0));document.getElementById('saleTotal').textContent=money(total);el.querySelectorAll('input,select').forEach(x=>x.oninput=calcSale);document.querySelector('#modal [name=discount]').oninput=calcSale}function saveSale(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let items=[...document.querySelectorAll('#saleLines .cartline')].map(l=>{let p=db.products.find(x=>x.id===l.querySelector('[name=prod]').value);return {productId:p.id,name:p.name,qty:+l.querySelector('[name=qty]').value,price:+l.querySelector('[name=price]').value,cost:+p.cost||0,barcode:p.barcode||''}});for(let i of items){let p=db.products.find(p=>p.id===i.productId);if(i.qty>p.stock){if(!confirm(`${p.name}: stock ni ${p.stock}, ushaka gukomeza?`))return}}let total=Math.max(0,sum(items,i=>i.qty*i.price)-(+f.discount||0));let paid=Math.min(total,+f.paid||0);let s={...f,id:uid(),invoice:'JSL-'+Date.now().toString().slice(-8),items,total,paid,discount:+f.discount||0};db.sales.push(s);items.forEach(i=>{let p=db.products.find(p=>p.id===i.productId);p.stock-=i.qty});save();closeModal();if(confirm('Igurisha ribitswe. Ushaka gucapa inyemezabuguzi?'))printInvoice(s.id)}
function payCustomer(id){let debt=sum(db.sales.filter(s=>s.customerId===id),s=>s.total-s.paid);if(!debt){alert('Nta mwenda ugaragara kuri uyu mukiriya.');return}openModal('Kwakira ubwishyu bw’umukiriya',`<form onsubmit="recordCustomerPayment(event,'${id}')"><p>Umwenda: <strong>${money(debt)}</strong></p><div class="formgrid">${field('Amafaranga yishyuye (RWF)','amount',debt,'number',`min="1" max="${debt}" required`)}${field('Itariki','date',today(),'date','required')}</div><p><button class="btn primary">Bika ubwishyu</button></p></form>`)}function recordCustomerPayment(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),left=+f.amount;db.sales.filter(s=>s.customerId===id&&s.paid<s.total).forEach(s=>{let add=Math.min(left,s.total-s.paid);s.paid+=add;left-=add});save();closeModal()}
function paySupplier(id){let debt=sum(db.purchases.filter(p=>p.supplierId===id),p=>p.total-p.paid);if(!debt){alert('Nta mwenda ugaragara kuri uyu muranguzi.');return}openModal('Kwishyura umuranguzi',`<form onsubmit="recordSupplierPayment(event,'${id}')"><p>Ayo ubereyemo: <strong>${money(debt)}</strong></p><div class="formgrid">${field('Amafaranga wishyuye (RWF)','amount',debt,'number',`min="1" max="${debt}" required`)}${field('Itariki','date',today(),'date','required')}</div><p><button class="btn primary">Bika ubwishyu</button></p></form>`)}function recordSupplierPayment(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),left=+f.amount;db.purchases.filter(p=>p.supplierId===id&&p.paid<p.total).forEach(p=>{let add=Math.min(left,p.total-p.paid);p.paid+=add;left-=add});save();closeModal()}
function receivePurchase(id){let p=db.purchases.find(x=>x.id===id);if(!p||p.received){alert('Iyi komanda yamaze kongerwa muri stock.');return}if(!confirm('Wemeza ko ibicuruzwa byageze? Stock izongerwa.'))return;p.items.forEach(i=>{let prod=db.products.find(x=>x.id===i.productId);if(prod){prod.stock+=i.qty;prod.cost=i.cost}});p.received=true;save()}function delItem(type,id){if(!confirm('Urashaka koko gusiba iyi nyandiko?'))return;db[type]=db[type].filter(x=>x.id!==id);save()}function delSale(id){if(!confirm('Gusiba igurisha ntibisubiza stock. Komeza?'))return;db.sales=db.sales.filter(s=>s.id!==id);save()}function delPurchase(id){if(!confirm('Siba iyi komanda? Niba yari yarageze, stock ntiyisubizwa.'))return;db.purchases=db.purchases.filter(p=>p.id!==id);save()}
function printInvoice(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let c=db.customers.find(x=>x.id===s.customerId);let w=window.open('','_blank','width=750,height=850');if(!w){alert('Chrome yabujije gufungura pop-up. Emerera pop-ups cyangwa ukoreshe Print kuri menu.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(s.invoice)}</title><style>body{font:14px Arial,sans-serif;color:#111;padding:24px;max-width:720px;margin:auto}h1{color:#166534;margin-bottom:4px}.muted{color:#666;font-size:12px}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}th{background:#f0fdf4}.right{text-align:right}.total{font-size:20px;font-weight:bold;color:#166534;text-align:right}.thanks{text-align:center;margin-top:40px}</style></head><body><h1>Jules Shop Ltd 🇷🇼</h1><div>${esc(db.settings.address||'Rwanda')} ${db.settings.phone?'• '+esc(db.settings.phone):''}</div><hr><h2>INYEMEZABUGUZI</h2><p><b>Nomero:</b> ${esc(s.invoice)}<br><b>Itariki:</b> ${esc(s.date)}<br><b>Umukiriya:</b> ${esc(c?.name||'Umukiriya utanditse')} ${c?.phone?'• '+esc(c.phone):''}</p><table><thead><tr><th>Igicuruzwa</th><th>Umubare</th><th>Igiciro</th><th class="right">Igiteranyo</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table><p class="right">Discount: ${money(s.discount||0)}</p><p class="total">Igiteranyo: ${money(s.total)}</p><p class="right">Yishyuye: ${money(s.paid)}<br>Umwenda: ${money(s.total-s.paid)}</p><div class="thanks">Murakoze guhaha muri Jules Shop Ltd!<br>🇷🇼 <span class="muted">Turabashimira.</span></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function filterRows(q,id){let root=document.getElementById(id);if(!root)return;let rows=root.querySelectorAll('tbody tr');q=q.toLowerCase();rows.forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function exportBackup(){let blob=new Blob([JSON.stringify({...db,backupDate:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,'Jules_Shop_Ltd_Backup_'+today()+'.json');alert('Backup yateguwe. Bika dosiye ahantu hizewe.')}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!confirm('Gusubizaho backup bizasimbura amakuru ari muri browser. Komeza?'))return;let base=blank();db={...base,...x};save();alert('Backup yasubijweho neza.')}catch(err){alert('Iyi dosiye ntabwo ari backup ya Jules Shop Ltd yemewe.')}e.target.value=''};r.readAsText(f)}function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}function downloadCSV(type){let rows=[],filename=type;const csv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';if(type==='products'){rows=[['Izina','Barcode','Cost','Price','Stock','Category'],...db.products.map(p=>[p.name,p.barcode,p.cost,p.price,p.stock,p.category])]}else if(type==='customers'){rows=[['Izina','Telefone','Umwenda'],...db.customers.map(c=>[c.name,c.phone,sum(db.sales.filter(s=>s.customerId===c.id),s=>s.total-s.paid)])]}else if(type==='suppliers'){rows=[['Izina','Telefone','Umwenda'],...db.suppliers.map(s=>[s.name,s.phone,supplierDebt(s.id)])]}else if(type==='sales'){rows=[['Invoice','Date','Customer','Total','Paid','Debt'],...db.sales.map(s=>[s.invoice,s.date,db.customers.find(c=>c.id===s.customerId)?.name,s.total,s.paid,s.total-s.paid])]}else if(type==='purchases'){rows=[['Order','Date','Supplier','Total','Paid','Debt','Received'],...db.purchases.map(p=>[p.orderNo,p.date,db.suppliers.find(s=>s.id===p.supplierId)?.name,p.total,p.paid,p.total-p.paid,p.received])]}else if(type==='expenses'){rows=[['Date','Title','Category','Amount','Payee'],...db.expenses.map(x=>[x.date,x.title,x.category,x.amount,x.payee])]}else if(type==='reports'){rows=[['Ukwezi','Igurisha','Yishyuye','Umwenda'],...Object.entries(db.sales.reduce((a,s)=>{let m=s.date.slice(0,7);a[m]??=[0,0];a[m][0]+=s.total;a[m][1]+=s.paid;return a},{})).map(([m,v])=>[m,v[0],v[1],v[0]-v[1]])]}downloadBlob(new Blob(['\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`Jules_Shop_${filename}_${today()}.csv`)}function saveSettings(e){e.preventDefault();Object.assign(db.settings,Object.fromEntries(new FormData(e.target)));save();alert('Amakuru y’iduka yabitswe.')}function clearAll(){if(prompt('Andika SIBA kugira ngo wemeze gusiba amakuru yose:')!=='SIBA')return;localStorage.removeItem(KEY);db=blank();save();alert('Amakuru yasibwe.')}
async function scanBarcode(){if(!('BarcodeDetector'in window)){openModal('Barcode scanner',`<p>Browser yawe ntabwo yemera camera barcode scanner muri ubu buryo. Ushobora kwandika barcode mu ntoki cyangwa ugakoresha scanner ya Bluetooth/USB.</p><div class="field"><label>Barcode</label><input id="manualBarcode" placeholder="Soma cyangwa wandike barcode"></div><p><button class="btn primary" onclick="useManualBarcode()">Shakisha igicuruzwa</button></p>`);return}openModal('Soma barcode ukoresheje camera',`<p>Emerera camera gukora hanyuma werekeze kuri barcode.</p><video id="scanVideo" class="camera" autoplay playsinline></video><p id="scanStatus" class="smallnote">Camera irimo gufunguka…</p><button class="btn" onclick="stopScan()">Hagarika camera</button>`);try{window.scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});let v=document.getElementById('scanVideo');v.srcObject=window.scanStream;let detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','qr_code']});window.scanTimer=setInterval(async()=>{try{let codes=await detector.detect(v);if(codes.length){let code=codes[0].rawValue;stopScan();let p=db.products.find(p=>p.barcode===code);if(p)alert('Byabonetse: '+p.name);else if(confirm('Barcode '+code+' ntiyabonetse. Ushaka kongeramo igicuruzwa gishya?')){openProduct();setTimeout(()=>{let el=document.querySelector('#modal [name=barcode]');if(el)el.value=code},100)}}}catch(e){}},500)}catch(e){let s=document.getElementById('scanStatus');if(s)s.textContent='Camera yanze gufunguka. Reba uruhushya rwa camera cyangwa wandike barcode mu ntoki.'}}function stopScan(){if(window.scanTimer)clearInterval(window.scanTimer);if(window.scanStream)window.scanStream.getTracks().forEach(t=>t.stop());window.scanStream=null}function useManualBarcode(){let v=document.getElementById('manualBarcode').value.trim();let p=db.products.find(p=>p.barcode===v);if(p){closeModal();current='products';render();alert('Byabonetse: '+p.name)}else{closeModal();openProduct();setTimeout(()=>{let el=document.querySelector('#modal [name=barcode]');if(el)el.value=v},100)}}
render('dashboard');
</script></body></html>
